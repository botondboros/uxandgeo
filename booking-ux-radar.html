<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weboldal láthatósági gyorselemzés – szállásoknak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6;
    --panel:#ffffff;
    --panel-2:#f3f1ec;
    --line:#e6e2da;
    --ink:#1c1a16;
    --ink-soft:#56514a;
    --ink-faint:#8d877c;
    --accent:#a8762a;
    --accent-soft:#c2954a;
    --good:#2c8a66;
    --good-bg:#e7f2ec;
    --ni:#b9801f;
    --ni-bg:#fbf1da;
    --poor:#c0492e;
    --poor-bg:#fae9e3;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px -22px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:44px 26px 90px}

  header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:24px}
  .brand{flex:1;min-width:0}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,4.6vw,42px);line-height:1.04;letter-spacing:-.01em}
  .brand p{color:var(--ink-soft);font-size:15px;max-width:82ch;margin-top:13px}
  .lang{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .lang button{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-faint);background:none;border:none;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.2s}
  .lang button.on{background:var(--accent);color:#fff}

  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .tabs button{background:none;border:none;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;font-weight:600;color:var(--ink-faint);padding:0 0 13px;cursor:pointer;position:relative;transition:.18s}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .panel h2{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin-bottom:3px}
  .panel .sub{color:var(--ink-faint);font-size:13.5px;margin-bottom:20px}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  @media(max-width:760px){.fields{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:7px;color:var(--ink-soft)}
  .field.you label::before{content:"\25CF";color:var(--accent);margin-right:6px;font-size:9px;vertical-align:2px}
  .field.rival label::before{content:"\25CB";color:var(--ink-faint);margin-right:6px;font-size:9px;vertical-align:2px}
  input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;transition:.2s}
  input::placeholder{color:#b3ada2}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,118,42,.13);background:#fff}
  .actions{margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .go{font-weight:600;font-size:15px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px 26px;cursor:pointer;transition:.18s}
  .go:hover{background:#94661f}
  .go:disabled{opacity:.55;cursor:wait}
  .err{color:var(--poor);font-size:13.5px;font-weight:500}
  .note{margin-top:16px;font-size:12.5px;color:var(--ink-faint);line-height:1.55;background:var(--panel-2);border-radius:10px;padding:11px 13px}

  #results{margin-top:36px;display:none}
  .ff-toggle{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 auto 26px;width:max-content}
  .ff-toggle button{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:none;border:none;padding:9px 20px;border-radius:999px;cursor:pointer;transition:.2s}
  .ff-toggle button.on{background:var(--panel-2);color:var(--ink)}

  .headline{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
  .headline .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:6px}
  .headline.good .dot{background:var(--good)} .headline.ni .dot{background:var(--ni)} .headline.poor .dot{background:var(--poor)}
  .headline h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;line-height:1.2;margin-bottom:3px}
  .headline p{color:var(--ink-soft);font-size:14.5px}

  .board{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:28px;box-shadow:var(--shadow);overflow:hidden}
  .board-row{display:grid;grid-template-columns:1fr 96px 96px;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .board-row:last-child{border-bottom:none}
  .board-row.head{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .board-row.head .col{justify-self:center}
  .board-name{font-weight:600;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:8px;word-break:break-all}
  .board-name .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:#fff;padding:2px 6px;border-radius:5px;flex-shrink:0}
  .sc{justify-self:center;min-width:50px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;padding:5px 0;border-radius:8px}
  .sc.good{background:var(--good-bg);color:var(--good)} .sc.ni{background:var(--ni-bg);color:var(--ni)} .sc.poor{background:var(--poor-bg);color:var(--poor)} .sc.none{background:var(--panel-2);color:var(--ink-faint)}

  .charts{margin:0 0 30px;display:grid;gap:16px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px 16px;box-shadow:var(--shadow)}
  .chart-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:64px}
  .track{position:relative;height:13px;border-radius:7px;display:flex;overflow:visible}
  .zone{height:100%}
  .zone.g{background:#bfe2d2;border-radius:7px 0 0 7px} .zone.n{background:#f3dca6} .zone.p{background:#f0c3b6;border-radius:0 7px 7px 0}
  .mark{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap;pointer-events:none}
  .mark .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-bottom:2px}
  .mark .stick{width:2px;flex:1 1 auto}
  .mark.you .lbl{background:var(--accent);color:#fff} .mark.you .stick{background:var(--accent)}
  .mark.rival .lbl{background:#fff;color:var(--ink-soft);border:1px solid var(--line)} .mark.rival .stick{background:var(--ink-faint)}
  .mark.lvl0{top:-64px;height:64px} .mark.lvl1{top:-46px;height:46px} .mark.lvl2{top:-28px;height:28px}
  .scale{display:flex;justify-content:space-between;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint)}
  .scale .th{color:var(--ink-soft)}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:860px){.cards{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
  .card.you{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  @keyframes rise{to{opacity:1;transform:none}}
  .card-top{padding:18px 20px 16px;border-bottom:1px solid var(--line)}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;border-radius:6px;font-weight:600;display:inline-block;margin-bottom:11px}
  .badge.you{background:var(--accent);color:#fff} .badge.rival{background:var(--panel-2);color:var(--ink-faint)}
  .host{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);word-break:break-all;display:block;margin-bottom:14px}
  .verdict{display:flex;gap:12px;align-items:flex-start}
  .vdot{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:17px;font-weight:700}
  .vdot.good{background:var(--good-bg);color:var(--good)} .vdot.ni{background:var(--ni-bg);color:var(--ni)} .vdot.poor{background:var(--poor-bg);color:var(--poor)} .vdot.none{background:var(--panel-2);color:var(--ink-faint)}
  .vtext{font-size:14.5px;font-weight:500;line-height:1.4}
  .card-body{padding:6px 20px 16px}
  .prio{margin:0 0 4px;padding:9px 12px;background:var(--ni-bg);border-radius:9px;font-size:12.5px;color:#8a5f12;line-height:1.4}
  .prio b{font-weight:700;color:var(--ni)}
  .area{padding:14px 0;border-bottom:1px solid var(--line)}
  .area:last-child{border-bottom:none}
  .area-head{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .area-head .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .area-head .d.good{background:var(--good)} .area-head .d.ni{background:var(--ni)} .area-head .d.poor{background:var(--poor)}
  .area-name{font-size:12.5px;font-weight:600;color:var(--ink)}
  .area-val{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .area-desc{font-size:13px;color:var(--ink-soft);line-height:1.5}
  .pct{font-size:12px;color:var(--ink-faint);margin-top:4px;padding-left:18px}
  .area-comp{font-size:12px;color:var(--poor);margin-top:5px;padding-left:18px;line-height:1.4}
  .nodata{padding:28px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.5}

  .psi-btn{display:block;margin:14px 20px 4px;padding:12px 14px;background:var(--ink);color:#fff;border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;text-align:center;transition:.16s}
  .psi-btn:hover{background:#000}
  .psi{display:block;padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;transition:.15s}
  .psi:hover{background:var(--panel-2)}

  .advice{margin:8px 20px 16px;padding:14px 16px;background:var(--panel-2);border-radius:11px}
  .advice-h{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink);margin-bottom:9px}
  .advice ul{margin:0;padding-left:18px}
  .advice li{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:8px}
  .advice li:last-child{margin-bottom:0}
  .advice.ok{background:var(--good-bg)}
  .advice.ok p{font-size:12.5px;color:#1f6b4f;line-height:1.5}

  details.tech{border-top:1px solid var(--line);background:var(--panel-2)}
  details.tech summary{padding:13px 20px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.tech summary::-webkit-details-marker{display:none}
  details.tech summary::after{content:"+";font-size:15px}
  details.tech[open] summary::after{content:"\2013"}
  .metric{padding:12px 20px;border-top:1px solid var(--line)}
  .metric-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .metric-name{font-size:12px;color:var(--ink-soft)} .metric-name b{color:var(--ink);font-weight:600}
  .metric-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
  .metric-val.good{color:var(--good)} .metric-val.ni{color:var(--ni)} .metric-val.poor{color:var(--poor)}
  .hbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--bg)}
  .hbar i{display:block;height:100%} .hbar i.g{background:var(--good)} .hbar i.n{background:var(--ni)} .hbar i.p{background:var(--poor)}
  .hleg{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:5px}

  #tab-method{display:none}
  .method{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:var(--shadow);max-width:760px}
  .method h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin-bottom:18px}
  .method h3{font-size:14px;font-weight:700;margin:22px 0 6px;color:var(--ink)}
  .method p{font-size:14px;color:var(--ink-soft);line-height:1.65;margin-bottom:6px}

  footer{margin-top:46px;text-align:center;color:var(--ink-faint);font-size:12px}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .shot-wrap{width:100%;aspect-ratio:16/10;background:var(--panel-2);overflow:hidden;border-bottom:1px solid var(--line)}
  .shot{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

  .seo-sec{padding:15px 20px;border-top:1px solid var(--line)}
  .seo-h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px}
  .seo-load{font-size:12.5px;color:var(--ink-faint)}
  .seo-chips{display:flex;gap:8px;margin-bottom:12px}
  .seo-chip{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 4px}
  .seo-chip .v{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px}
  .seo-chip .l{font-size:9.5px;color:var(--ink-faint);margin-top:3px;line-height:1.2}
  .seo-chip.good .v{color:var(--good)} .seo-chip.ni .v{color:var(--ni)} .seo-chip.poor .v{color:var(--poor)} .seo-chip.none .v{color:var(--ink-faint)}
  .seo-issues b{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
  .seo-issues ul{padding-left:18px;margin:0}
  .seo-issues li{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:6px}

  #tab-geo{display:none}
  .geo-summary{margin:30px 0 20px;display:flex;gap:14px;align-items:flex-start}
  .geo-summary h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;line-height:1.2;margin-bottom:3px}
  .geo-summary p{color:var(--ink-soft);font-size:14.5px}
  .gboard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px}
  .grow{display:grid;grid-template-columns:1.6fr 64px 70px 56px;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .grow:last-child{border-bottom:none}
  .grow.head{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .gname{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .gname .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:#fff;padding:2px 6px;border-radius:5px}
  .gbar{height:9px;background:var(--panel-2);border-radius:5px;overflow:hidden}
  .gbar i{display:block;height:100%;background:var(--accent)}
  .gsc{justify-self:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px}
  .gsub{font-size:11px;color:var(--ink-faint);margin-top:4px}
  details.gq{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  details.gq summary{padding:13px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);list-style:none}
  details.gq summary::-webkit-details-marker{display:none}
  .gq-body{padding:0 16px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
  .gq-q{font-weight:600;color:var(--ink);margin:10px 0 4px}
  .gq-hit{color:var(--good);font-weight:600}
  .gq-miss{color:var(--ink-faint)}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 data-i="title"></h1>
      <p data-i="lede"></p>
    </div>
    <div class="lang">
      <button id="en" onclick="setLang('en')">EN</button>
      <button id="hu" class="on" onclick="setLang('hu')">HU</button>
    </div>
  </header>

  <div class="tabs">
    <button id="tab-b-analysis" class="on" onclick="setTab('analysis')" data-i="tabAnalysis"></button>
    <button id="tab-b-geo" onclick="setTab('geo')" data-i="tabGeo"></button>
    <button id="tab-b-method" onclick="setTab('method')" data-i="tabMethod"></button>
  </div>

  <div id="tab-analysis">
    <div class="panel">
      <h2 data-i="panelTitle"></h2>
      <div class="sub" data-i="panelSub"></div>
      <div class="fields">
        <div class="field you"><label data-i="lblYou"></label><input type="text" id="u0" placeholder="szallodam.hu"></div>
        <div class="field rival"><label data-i="lblR1"></label><input type="text" id="u1" placeholder="versenytars1.hu"></div>
        <div class="field rival"><label data-i="lblR2"></label><input type="text" id="u2" placeholder="versenytars2.hu"></div>
      </div>
      <div class="actions">
        <button class="go" id="go" onclick="run()"><span data-i="btn"></span></button>
        <span class="err" id="err"></span>
      </div>
      <div class="note" data-i="trafficNote"></div>
    </div>

    <div id="results">
      <div class="ff-toggle">
        <button id="ffPHONE" class="on" onclick="setFF('PHONE')" data-i="ffMobile"></button>
        <button id="ffDESKTOP" onclick="setFF('DESKTOP')" data-i="ffDesktop"></button>
      </div>
      <div class="headline" id="headline"></div>
      <div class="board" id="board"></div>
      <div class="charts" id="charts"></div>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <div id="tab-method">
    <div class="method" id="method"></div>
  </div>

  <div id="tab-geo">
    <div class="panel">
      <h2 data-i="geoTitle"></h2>
      <div class="sub" data-i="geoSub"></div>
      <div class="fields">
        <div class="field you"><label data-i="geoLblHotel"></label><input type="text" id="g0" placeholder="Casati Budapest Hotel"></div>
        <div class="field rival"><label data-i="geoLblR1"></label><input type="text" id="g1" placeholder="1. versenytárs neve"></div>
        <div class="field rival"><label data-i="geoLblR2"></label><input type="text" id="g2" placeholder="2. versenytárs neve"></div>
      </div>
      <div class="fields" style="margin-top:15px">
        <div class="field"><label data-i="geoLblCity"></label><input type="text" id="gcity" placeholder="Budapest"></div>
        <div class="field"><label data-i="geoLblType"></label><input type="text" id="gtype" placeholder="pl. 3 csillagos butikhotel"></div>
        <div class="field"><label data-i="geoLblUSP"></label><input type="text" id="gusp" placeholder="pl. spa, családbarát, belváros"></div>
      </div>
      <div class="actions">
        <button class="go" id="ggo" onclick="runGeo()"><span data-i="geoBtn"></span></button>
        <span class="err" id="gerr"></span>
      </div>
      <div class="note" data-i="geoNote"></div>
    </div>
    <div id="geo-results"></div>
  </div>

  <footer><p data-i="foot"></p></footer>
</div>

<script>
/* ============================================================
   CONFIG
   Éles (GitHub Pages) használathoz állítsd be a PROXY_URL-t a saját
   Cloudflare Worker címére. Ez NEM titok — nyugodtan bekerülhet a
   GitHubba. A Google API-kulcs a Workerben, titkos env-változóban él,
   soha nem kerül a böngészőbe és nem kerül a repóba.
   ------------------------------------------------------------
   Az API_KEY mező CSAK helyi teszthez van. SOHA ne kerüljön GitHubba!
   Ha a PROXY_URL ki van töltve, a tool ezt figyelmen kívül hagyja.
   ============================================================ */
const PROXY_URL = "https://crux-proxy.bboroscv.workers.dev"
const API_KEY   = "PASTE_YOUR_CRUX_API_KEY_HERE";

/* ---------- i18n ---------- */

let lang='hu', ff='PHONE', tab='analysis', DATA=null;

function setLang(l){
  lang=l;
  document.getElementById('hu').classList.toggle('on',l==='hu');
  document.getElementById('en').classList.toggle('on',l==='en');
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(I[l][k]!==undefined)el.innerHTML=I[l][k];});
  renderMethod();
  if(DATA) render();
}
function setFF(f){
  ff=f;
  document.getElementById('ffPHONE').classList.toggle('on',f==='PHONE');
  document.getElementById('ffDESKTOP').classList.toggle('on',f==='DESKTOP');
  if(DATA) render();
}
function setTab(t){
  tab=t;
  ['analysis','geo','method'].forEach(x=>{
    document.getElementById('tab-b-'+x).classList.toggle('on',t===x);
    document.getElementById('tab-'+x).style.display=t===x?'block':'none';
  });
}
function renderMethod(){
  const m=I[lang].method;let h='<h2>'+I[lang].tabMethod+'</h2>';
  m.forEach(([t,p])=>{h+='<h3>'+t+'</h3><p>'+p+'</p>';});
  document.getElementById('method').innerHTML=h;
}

/* ---------- CrUX ---------- */
const METRICS=['largest_contentful_paint','interaction_to_next_paint','cumulative_layout_shift','first_contentful_paint'];
const TH={largest_contentful_paint:[2500,4000],interaction_to_next_paint:[200,500],cumulative_layout_shift:[0.1,0.25],first_contentful_paint:[1800,3000]};
function rate(metric,v){const t=TH[metric];if(v<=t[0])return'good';if(v<=t[1])return'ni';return'poor';}
function toOrigin(raw){let s=raw.trim();if(!s)return null;if(!/^https?:\/\//i.test(s))s='https://'+s;try{return new URL(s).origin;}catch(e){return null;}}
function altOrigin(origin){try{const u=new URL(origin);if(u.hostname.startsWith('www.'))u.hostname=u.hostname.slice(4);else u.hostname='www.'+u.hostname;return u.origin;}catch(e){return null;}}
async function fetchCrux(origin,formFactor,key){
  const body=JSON.stringify({origin,formFactor,metrics:METRICS});
  const url = PROXY_URL ? PROXY_URL : 'https://chromeuxreport.googleapis.com/v1/records:queryRecord?key='+encodeURIComponent(key);
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body});
  if(res.status===404)return{origin,notFound:true};
  if(res.status===400||res.status===403){const e=new Error('key');e.kind='key';throw e;}
  if(!res.ok){const e=new Error('net');e.kind='net';throw e;}
  const j=await res.json();const out={origin,metrics:{}};const m=(j.record&&j.record.metrics)||{};
  METRICS.forEach(k=>{if(m[k]){out.metrics[k]={p75:Number(m[k].percentiles.p75),histogram:m[k].histogram.map(h=>Number(h.density||0))};}});
  return out;
}

function fmt(metric,v){if(metric==='cumulative_layout_shift')return v.toFixed(2);return v>=1000?(v/1000).toFixed(2)+' s':Math.round(v)+' ms';}
function fmtFriendly(metric,v){if(metric==='cumulative_layout_shift'){const s=v.toFixed(2);return lang==='hu'?s.replace('.',','):s;}if(v>=1000){const s=(v/1000).toFixed(1);return(lang==='hu'?s.replace('.',','):s)+(lang==='hu'?' mp':' s');}return Math.round(v)+' ms';}
function bestRivalVal(metric){let best=null;DATA.filter(s=>s.role==='rival').forEach(s=>{const d=s[ff];if(d&&!d.notFound&&d.metrics[metric]){const v=d.metrics[metric].p75;if(best===null||v<best)best=v;}});return best;}
function ffScore(site,fff){const d=site[fff];if(!d||d.notFound||!d.metrics.largest_contentful_paint)return null;const w={good:100,ni:60,poor:25};let s=0,n=0;['largest_contentful_paint','interaction_to_next_paint','cumulative_layout_shift'].forEach(k=>{if(d.metrics[k]){s+=w[rate(k,d.metrics[k].p75)];n++;}});return n?Math.round(s/n):null;}
function scoreBand(s){return s>=85?'good':s>=60?'ni':'poor';}
function overallRating(site){const d=site[ff];if(!d||d.notFound||!d.metrics.largest_contentful_paint)return'none';let worst='good';['largest_contentful_paint','interaction_to_next_paint','cumulative_layout_shift'].forEach(k=>{if(d.metrics[k]){const r=rate(k,d.metrics[k].p75);if(r==='poor')worst='poor';else if(r==='ni'&&worst!=='poor')worst='ni';}});return worst;}

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();}
const GEO_STOP=new Set(['hotel','hotels','szallo','szalloda','szallas','panzio','apartman','apartments','apartment','resort','inn','house','haz','budapest','the','and','boutique','grand','city','center','centrum','spa']);
function brandToks(name){return norm(name).split(' ').filter(t=>t.length>=3&&!GEO_STOP.has(t));}
function matchTier(name,rawLower,respNorm){
  const nm=name.toLowerCase().trim();
  if(nm&&rawLower.indexOf(nm)>=0)return 'exact';
  const nn=norm(name);
  if(nn&&respNorm.indexOf(nn)>=0)return 'accent';
  const toks=brandToks(name);
  if(toks.length&&toks.every(t=>respNorm.indexOf(t)>=0))return 'brand';
  const strong=toks.filter(t=>t.length>=5);
  if(strong.some(t=>respNorm.indexOf(t)>=0))return 'strong';
  return null;
}
function posOf(name,respNorm){
  const nn=norm(name);let p=nn?respNorm.indexOf(nn):-1;
  if(p<0){brandToks(name).filter(t=>t.length>=5).forEach(t=>{const q=respNorm.indexOf(t);if(q>=0&&(p<0||q<p))p=q;});}
  return p<0?Infinity:p;
}
async function fetchGemini(prompt,opts){
  opts=opts||{};
  const res=await fetch(proxyBase()+'/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,ground:opts.ground,json:opts.json})});
  if(!res.ok)throw new Error('gemini');
  const j=await res.json();
  const c=(j.candidates||[])[0]||{};const parts=((c.content||{}).parts)||[];
  return parts.map(p=>p.text||'').join(' ');
}
function buildAnalysisPrompt(info,responses){

}
let GEO=null;
async function runGeo(){
  const T=I[lang];const err=document.getElementById('gerr');err.textContent='';
  if(!PROXY_URL){err.textContent=T.geoNeedProxy;return;}
  const name=document.getElementById('g0').value.trim();
  const city=document.getElementById('gcity').value.trim();
  if(!name||!city){err.textContent=T.geoFields;return;}
  const rivals=[document.getElementById('g1').value.trim(),document.getElementById('g2').value.trim()].filter(Boolean);
  const info={name,city,type:document.getElementById('gtype').value.trim(),usp:document.getElementById('gusp').value.trim(),rivals};
  const props=[{role:'you',name}].concat(rivals.map(n=>({role:'rival',name:n})));
  const prompts=T.geoPrompts.map(p=>p.split('{city}').join(city));
  const btn=document.getElementById('ggo');btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+T.geoRunning;
  let raw,ai=null;
  try{
    raw=await Promise.all(prompts.map(p=>fetchGemini(p,{ground:true})));           // PHASE 1: discovery
    try{const t=await fetchGemini(buildAnalysisPrompt(info,raw),{ground:false,json:true});ai=JSON.parse(t.replace(/```json/gi,'').replace(/```/g,'').trim());}catch(e){ai=null;} // PHASE 3: AI analysis
  }catch(e){btn.disabled=false;btn.innerHTML='<span>'+T.geoBtn+'</span>';err.textContent=T.geoErr;return;}
  btn.disabled=false;btn.innerHTML='<span>'+T.geoBtn+'</span>';
  // PHASE 2: rules engine (0 API)
  const lowers=raw.map(r=>(r||'').toLowerCase());const norms=raw.map(r=>norm(r));const N=prompts.length;
  props.forEach(p=>{p.count=0;p.first=0;});
  for(let i=0;i<N;i++){
    const row=props.map(p=>{const tier=matchTier(p.name,lowers[i],norms[i]);return {p,tier,pos:tier?posOf(p.name,norms[i]):Infinity};});
    const minPos=Math.min.apply(null,row.filter(x=>x.tier).map(x=>x.pos).concat([Infinity]));
    row.forEach(x=>{if(x.tier){x.p.count++;if(x.pos===minPos)x.p.first++;}});
  }
  const total=props.reduce((a,p)=>a+p.count,0)||1;
  const sentiment=(ai&&typeof ai.sentiment==='number')?Math.max(0,Math.min(1,ai.sentiment)):0.5;
  props.forEach(p=>{const mr=p.count/N,fr=p.count?p.first/p.count:0,sent=p.role==='you'?sentiment:0.5;
    p.score=Math.round(100*(0.5*mr+0.25*fr+0.25*sent));p.sov=Math.round(p.count/total*100);p.firstRate=Math.round(fr*100);});
  const matrix=props.map(p=>raw.map((_,i)=>matchTier(p.name,lowers[i],norms[i])));
  GEO={props,prompts,matrix,ai,N};
  renderGeo();
}

  defs.forEach(pair=>{
    const metric=pair[0],name=pair[1],c=CHART[metric];
    const gPct=c.good/c.max*100,nPct=(c.poor-c.good)/c.max*100,pPct=100-gPct-nPct;
    let marks='';
    DATA.forEach((s,i)=>{const d=s[ff];if(!d||d.notFound||!d.metrics[metric])return;any=true;const v=d.metrics[metric].p75;const left=Math.min(Math.max(v/c.max*100,1.5),98.5);const role=s.role==='you'?'you':'rival';marks+='<div class="mark '+role+' lvl'+i+'" style="left:'+left+'%"><span class="lbl">'+fmtFriendly(metric,v)+'</span><span class="stick"></span></div>';});
    html+='<div class="chart"><div class="chart-title">'+name+'</div><div class="track"><div class="zone g" style="width:'+gPct+'%"></div><div class="zone n" style="width:'+nPct+'%"></div><div class="zone p" style="width:'+pPct+'%"></div>'+marks+'</div><div class="scale"><span>0</span><span class="th">'+T.scGood+' '+fmtFriendly(metric,c.good)+'</span><span class="th">'+T.scPoor+' '+fmtFriendly(metric,c.poor)+'+</span></div></div>';
  });
  el.innerHTML=any?html:'';
}

setLang('hu');
setTab('analysis');
</script>
